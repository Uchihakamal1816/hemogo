name: Deploy

# Runs only after CI passes on a push to main, so failing code cannot reach production.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Firebase
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
      VITE_FIREBASE_PROJECT_ID: hemogo-emergency
      VITE_FIREBASE_AUTH_DOMAIN: hemogo-emergency.firebaseapp.com
      VITE_FIREBASE_STORAGE_BUCKET: hemogo-emergency.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '178128292194'
      VITE_FIREBASE_APP_ID: 1:178128292194:web:597686eb9b6b12655d443b
      VITE_FIREBASE_MEASUREMENT_ID: G-GZ7LDF9SE6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Node 22.23.0 breaks the Google credential exchange, so stay on a known good release.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Refuse to build without the public Firebase config
        run: |
          test -n "$VITE_FIREBASE_API_KEY"
          test -n "$VITE_FIREBASE_VAPID_KEY"
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm run build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/178128292194/locations/global/workloadIdentityPools/github/providers/hemogo-repo
          service_account: github-deployer@hemogo-emergency.iam.gserviceaccount.com
      # Functions first, then the site, then the rules, so new rules never meet old code.
      - name: Deploy functions
        run: npx firebase deploy --only functions --project hemogo-emergency --non-interactive
      - name: Deploy website
        run: npx firebase deploy --only hosting --project hemogo-emergency --non-interactive
      - name: Deploy security rules and indexes
        run: npx firebase deploy --only firestore --project hemogo-emergency --non-interactive
