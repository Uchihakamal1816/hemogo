name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Unit tests
        run: npm test
        working-directory: functions
      - name: Add throwaway payment secrets for the emulator
        run: |
          cat > functions/.secret.local <<'SECRETS'
          RAZORPAY_KEY_ID=rzp_test_local
          RAZORPAY_KEY_SECRET=local_key_secret
          RAZORPAY_WEBHOOK_SECRET=local_webhook_secret
          SECRETS
          sed -i 's/^ *//' functions/.secret.local
      - name: End-to-end tests on the Firebase emulators
        run: npm run test:e2e
